name: ASI XAUUSD Manual Runner

on:
  # Cron schedule dihapus untuk mencegah pelanggaran Terms of Service GitHub.
  # Gunakan workflow_dispatch agar bisa dijalankan secara manual jika diperlukan.
  workflow_dispatch:

jobs:
  run-asi-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Menambahkan instalasi websocket-client secara eksplisit untuk mencegah error module
          pip install websocket-client

      - name: Run ASI Bot Autonomous Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot_asi_sniper.py
